<!DOCTYPE html>
<html>
<head>
    <title>Personal Profile</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
        margin: 0;
        padding: 30px 15px;
        color: #333333;
    }

    .container {
        max-width: 450px;
        margin: 40px auto;
        padding: 35px;
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    h2 {
        text-align: center;
        color: #243b53;
        margin-bottom: 30px;
    }

    input, textarea {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        margin-bottom: 18px;
        box-sizing: border-box;
        border: 1px solid #d9dee7;
        border-radius: 6px;
        font-family: Arial, sans-serif;
        font-size: 14px;
    }

    input:focus, textarea:focus {
        outline: none;
        border-color: #526d91;
    }

    input[type=submit] {
        background-color: #243b53;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 13px;
        font-size: 15px;
        cursor: pointer;
    }

    input[type=submit]:hover {
        background-color: #344f6f;
    }

    </style>
</head>

<body>

    <div class="container">

        <h2>Personal Profile Form</h2>

        <form action="ProfileServlet" method="post">

            Name:
            <input type="text" name="name" required>

            Student ID:
            <input type="text" name="studentId" required>

            Programme:
            <input type="text" name="programme" required>

            Email:
            <input type="text" name="email" required>

            Hobbies:
            <input type="text" name="hobbies" required>

            Short Self-Introduction:
            <textarea name="introduction" rows="4" required></textarea>

            <input type="submit" value="Submit Profile">

        </form>

    </div>

</body>
</html>
